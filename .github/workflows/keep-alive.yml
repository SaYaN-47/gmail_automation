name: Keep Render Awake

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:  # lets you trigger it manually from GitHub UI too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sf https://gmail-automation-dzx6.onrender.com/health || echo "Ping failed, but not blocking"
